[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careloop"
version = "1.2.2"
description = "CareLoop simulated clinical sandbox for longitudinal medical AI evaluation"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.19.0"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]
analysis = ["numpy>=1.24", "pandas>=2.0", "reportlab>=4.0"]

[project.scripts]
careloop-runtime = "careloop.runtime_lite.cli:main"

[tool.setuptools.packages.find]
include = ["careloop*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.md", "*.txt"]
