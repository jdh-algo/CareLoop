# CareLoop provider configuration example for documentation.
# The released scripts read environment variables by default; this YAML file is
# intentionally not loaded automatically to avoid accidental secret commits.
# Copy to configs/provider.local.yaml if you build your own loader.

base_url: "https://your-openai-compatible-provider.example/v1"
api_key_env: "CARELOOP_LITE_API_KEY"
runtime_model: "replace-with-model-id"
simulator_model: "replace-with-simulator-model-id"
tested_doctor_model_label: "replace-with-tested-doctor-label"
tested_doctor_model_api_id: "replace-with-provider-model-id-if-different"
judge_model: "replace-with-judge-model-id"
