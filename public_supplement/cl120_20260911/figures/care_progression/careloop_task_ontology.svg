<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="780" viewBox="0 0 2200 780"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355b73"/></marker></defs><text x="70" y="65" font-family="Arial,Helvetica,sans-serif" font-size="40" text-anchor="start" font-weight="700" fill="#17202a">From latent limitations to observable care consequences</text><rect x="55" y="150" width="275" height="125" rx="18" fill="#edf4f7" stroke="#d7dee4" stroke-width="2"/><text x="192.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle" font-weight="600" fill="#17202a">Distributed state</text><text x="192.5" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400" fill="#43515c">truth · belief · record</text><line x1="338" y1="212.5" x2="385" y2="212.5" stroke="#355b73" stroke-width="6" marker-end="url(#a)"/><rect x="395" y="150" width="275" height="125" rx="18" fill="#fff1e9" stroke="#d7dee4" stroke-width="2"/><text x="532.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle" font-weight="600" fill="#17202a">Real-world friction</text><text x="532.5" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400" fill="#43515c">hidden · delayed · infeasible</text><line x1="678" y1="212.5" x2="725" y2="212.5" stroke="#355b73" stroke-width="6" marker-end="url(#a)"/><rect x="735" y="150" width="275" height="125" rx="18" fill="#eef6f3" stroke="#d7dee4" stroke-width="2"/><text x="872.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle" font-weight="600" fill="#17202a">Behavioral fork</text><text x="872.5" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400" fill="#43515c">ask · verify · act · wait</text><line x1="1018" y1="212.5" x2="1065" y2="212.5" stroke="#355b73" stroke-width="6" marker-end="url(#a)"/><rect x="1075" y="150" width="275" height="125" rx="18" fill="#edf4f7" stroke="#d7dee4" stroke-width="2"/><text x="1212.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle" font-weight="600" fill="#17202a">World response</text><text x="1212.5" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400" fill="#43515c">patient · family · system</text><line x1="1358" y1="212.5" x2="1405" y2="212.5" stroke="#355b73" stroke-width="6" marker-end="url(#a)"/><rect x="1415" y="150" width="275" height="125" rx="18" fill="#eef6f3" stroke="#d7dee4" stroke-width="2"/><text x="1552.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle" font-weight="600" fill="#17202a">Plan revision</text><text x="1552.5" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400" fill="#43515c">reprioritize · repair</text><line x1="1698" y1="212.5" x2="1745" y2="212.5" stroke="#355b73" stroke-width="6" marker-end="url(#a)"/><rect x="1755" y="150" width="275" height="125" rx="18" fill="#fff1e9" stroke="#d7dee4" stroke-width="2"/><text x="1892.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle" font-weight="600" fill="#17202a">Episode state</text><text x="1892.5" y="233" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400" fill="#43515c">safe closure · bounded open</text><path d="M 1890 300 C 1720 440, 1120 430, 890 305" fill="none" stroke="#2a9d8f" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#a)"/><text x="1390" y="430" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" font-weight="500" fill="#267b70">Later evidence can invalidate earlier assumptions and reopen the plan</text><text x="70" y="500" font-family="Arial,Helvetica,sans-serif" font-size="28" text-anchor="start" font-weight="700" fill="#17202a">Observable diagnostic readout</text><rect x="90" y="535" width="430" height="110" rx="18" fill="#edf4f7" stroke="#d7dee4" stroke-width="2"/><text x="305.0" y="583" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle" font-weight="600" fill="#17202a">Opportunity</text><text x="305.0" y="618" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400" fill="#43515c">Was the designed pressure point realized?</text><line x1="528" y1="590" x2="585" y2="590" stroke="#355b73" stroke-width="6" marker-end="url(#a)"/><rect x="595" y="535" width="430" height="110" rx="18" fill="#eef6f3" stroke="#d7dee4" stroke-width="2"/><text x="810.0" y="583" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle" font-weight="600" fill="#17202a">Action</text><text x="810.0" y="618" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400" fill="#43515c">Did the model respond actively?</text><line x1="1033" y1="590" x2="1090" y2="590" stroke="#355b73" stroke-width="6" marker-end="url(#a)"/><rect x="1100" y="535" width="430" height="110" rx="18" fill="#edf4f7" stroke="#d7dee4" stroke-width="2"/><text x="1315.0" y="583" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle" font-weight="600" fill="#17202a">Impact</text><text x="1315.0" y="618" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400" fill="#43515c">Did the response change the trajectory?</text><line x1="1538" y1="590" x2="1595" y2="590" stroke="#355b73" stroke-width="6" marker-end="url(#a)"/><rect x="1605" y="535" width="430" height="110" rx="18" fill="#eef6f3" stroke="#d7dee4" stroke-width="2"/><text x="1820.0" y="583" font-family="Arial,Helvetica,sans-serif" font-size="27" text-anchor="middle" font-weight="600" fill="#17202a">Continuity</text><text x="1820.0" y="618" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" font-weight="400" fill="#43515c">Was residual risk safely closed or owned?</text><text x="70" y="720" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" font-weight="500" fill="#43515c">Responsibility and minimum duties constrain safety throughout the process; they are guardrails around friction-sensitive care progression.</text></svg>